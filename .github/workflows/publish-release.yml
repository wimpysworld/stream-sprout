name: Publish Release 🏷️

on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish"
        type: "string"
        required: true

permissions: {}

jobs:
  version-check:
    name: "Check versions ⚖️"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: >-
            ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}
      - name: "Compare App and Git versions 🟰"
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          APP_VERSION=$(grep '^readonly VERSION=' stream-sprout | cut -d'"' -f2)
          GIT_VERSION="${RELEASE_TAG#v}"
          GIT_VERSION="${GIT_VERSION%%-*}"
          echo "App version: ${APP_VERSION}"
          echo "Git version: ${GIT_VERSION}"
          if [[ "${APP_VERSION}" != "${GIT_VERSION}" ]]; then
            echo "ERROR! Version mismatch."
            exit 1
          fi

  build-release:
    needs: [version-check]
    name: "Build Release 👨‍🔧"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: >-
            ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}
      - name: "Install nfpm 📦"
        run: |
          NFPM_VERSION="2.46.3"
          NFPM_SHA256="9170d25ea056d7329def38134b2bcad98d02d221f8331610dcd619e84d28c565"
          ARCHIVE="${RUNNER_TEMP}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location --retry 5 \
            --output "${ARCHIVE}" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  ${ARCHIVE}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${ARCHIVE}" -C "${RUNNER_TEMP}/bin" nfpm
          "${RUNNER_TEMP}/bin/nfpm" --version
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: "Build Linux packages 📦"
        run: |
          REL_VER=$(grep '^readonly VERSION=' stream-sprout | cut -d'"' -f2)
          mkdir -p dist
          VERSION="${REL_VER}" nfpm package --config nfpm.yaml \
            --packager deb \
            --target "dist/stream-sprout_${REL_VER}_all.deb"
          VERSION="${REL_VER}" nfpm package --config nfpm.yaml \
            --packager rpm \
            --target "dist/stream-sprout-${REL_VER}-1.noarch.rpm"
          VERSION="${REL_VER}" nfpm package --config nfpm.yaml \
            --packager apk \
            --target "dist/stream-sprout_${REL_VER}_noarch.apk"
          VERSION="${REL_VER}" nfpm package --config nfpm.yaml \
            --packager archlinux \
            --target "dist/stream-sprout-${REL_VER}-1-any.pkg.tar.zst"
          (
            cd dist
            sha256sum \
              "stream-sprout_${REL_VER}_all.deb" \
              "stream-sprout-${REL_VER}-1.noarch.rpm" \
              "stream-sprout_${REL_VER}_noarch.apk" \
              "stream-sprout-${REL_VER}-1-any.pkg.tar.zst" \
              > "stream-sprout_${REL_VER}_checksums.txt"
          )
      - name: "Publish release 📤️"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          REL_VER=$(grep '^readonly VERSION=' stream-sprout | cut -d'"' -f2)
          PRERELEASE_ARGS=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            --draft --generate-notes "${PRERELEASE_ARGS[@]}"
          gh release upload "${RELEASE_TAG}" \
            "dist/stream-sprout_${REL_VER}_all.deb" \
            "dist/stream-sprout-${REL_VER}-1.noarch.rpm" \
            "dist/stream-sprout_${REL_VER}_noarch.apk" \
            "dist/stream-sprout-${REL_VER}-1-any.pkg.tar.zst" \
            "dist/stream-sprout_${REL_VER}_checksums.txt" \
            --clobber
          ASSET_COUNT=$(gh release view "${RELEASE_TAG}" \
            --json assets --template '{{len .assets}}')
          if [[ "${ASSET_COUNT}" -lt 5 ]]; then
            echo "ERROR! Expected 5 release assets, found ${ASSET_COUNT}."
            exit 1
          fi
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          gh release view "${RELEASE_TAG}" \
            --json body --jq .body > "${NOTES_FILE}"
          {
            printf '\n## Install\n\n'
            for entry in \
              "Debian and Ubuntu|apt" \
              "Fedora and openSUSE|rpm" \
              "Arch Linux|pkg" \
              "Alpine Linux|apk" \
              "Nix and NixOS|nix"
            do
              label="${entry%|*}"
              host="${entry#*|}.wimpys.world"
              printf -- '- %s: [%s](https://%s/#stream-sprout)\n' \
                "${label}" "${host}" "${host}"
            done
            printf -- '- Container: \140%s\140\n' \
              "docker pull ghcr.io/wimpysworld/stream-sprout:latest-alpine"
          } >> "${NOTES_FILE}"
          gh release edit "${RELEASE_TAG}" \
            --draft=false --notes-file "${NOTES_FILE}"
      - name: Move latest tag
        if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git tag --force latest "${RELEASE_TAG}^{commit}"
          git push --force origin refs/tags/latest

  publish-container:
    needs: [version-check]
    name: "Publish Container 🐋"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: "Checkout 🥡"
        uses: actions/checkout@v7
        with:
          ref: >-
            ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Container Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get stream-sprout version 🔢
        id: get_version
        run: |
          STREAM_SPROUT_VER=$(
            grep '^readonly VERSION=' stream-sprout | cut -d'"' -f2
          )
          echo "STREAM_SPROUT_VER=${STREAM_SPROUT_VER}" >> "${GITHUB_ENV}"
      - name: "Build Container 🐋"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest-alpine
            ghcr.io/${{ github.repository }}:${{ env.STREAM_SPROUT_VER }}-alpine
            ghcr.io/${{ github.repository }}:${{ github.sha }}-alpine
          platforms: linux/amd64, linux/arm64
      - name: "Generate SBOM"
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}:latest-alpine
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Logout from Container Registry
        run: docker logout ghcr.io

  publish-snap:
    needs: [version-check]
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    name: "Publish Snap 📦"
    permissions:
      contents: read
    uses: ./.github/workflows/publish-snap.yml
    with:
      ref: >-
        ${{
          inputs.tag != '' && format('refs/tags/{0}', inputs.tag)
          || github.ref
        }}
      channel: stable
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  publish-aur:
    needs: [build-release]
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    name: "Publish AUR 🏔️"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: >-
            ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false
      - name: "Generate PKGBUILD and .SRCINFO 📦"
        id: pkgbuild
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          REL_VER=$(grep '^readonly VERSION=' stream-sprout | cut -d'"' -f2)
          TARBALL_URL="https://github.com/wimpysworld/stream-sprout/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          ARCHIVE="${RUNNER_TEMP}/stream-sprout-${REL_VER}.tar.gz"
          curl --fail --silent --show-error --location --retry 5 \
            --output "${ARCHIVE}" \
            "${TARBALL_URL}"
          TARBALL_SHA256=$(sha256sum "${ARCHIVE}" | awk '{print $1}')
          PKGDESC="Restream a video source to multiple destinations"
          PKGDESC+=" such as Twitch, YouTube, Owncast, and PeerTube."
          DOC_DST="\${pkgdir}/usr/share/doc/\${pkgname}"
          DOC_DST+="/stream-sprout.yaml.example"
          LIC_DST="\${pkgdir}/usr/share/licenses/\${pkgname}/LICENSE"
          STAGING_DIR="${RUNNER_TEMP}/aur-staging"
          mkdir -p "${STAGING_DIR}"
          cat > "${STAGING_DIR}/PKGBUILD" <<EOF
          # Maintainer: Martin Wimpress <code@wimpress.io>
          pkgname=stream-sprout
          pkgver=${REL_VER}
          pkgrel=1
          pkgdesc="${PKGDESC}"
          arch=('any')
          url="https://stream-sprout.wimpys.world/"
          license=('Apache-2.0')
          depends=('bash' 'coreutils' 'ffmpeg' 'gawk' 'grep' 'sed')
          source=("\${pkgname}-\${pkgver}.tar.gz::${TARBALL_URL}")
          sha256sums=("${TARBALL_SHA256}")

          package() {
            cd "\${pkgname}-\${pkgver}"
            install -Dm0755 stream-sprout "\${pkgdir}/usr/bin/stream-sprout"
            install -Dm0644 stream-sprout.yaml.example "${DOC_DST}"
            install -Dm0644 LICENSE "${LIC_DST}"
          }
          EOF
          {
            printf 'pkgbase = stream-sprout\n'
            printf '\tpkgdesc = %s\n' "${PKGDESC}"
            printf '\tpkgver = %s\n' "${REL_VER}"
            printf '\tpkgrel = 1\n'
            printf '\turl = https://stream-sprout.wimpys.world/\n'
            printf '\tarch = any\n'
            printf '\tlicense = Apache-2.0\n'
            printf '\tdepends = bash\n'
            printf '\tdepends = coreutils\n'
            printf '\tdepends = ffmpeg\n'
            printf '\tdepends = gawk\n'
            printf '\tdepends = grep\n'
            printf '\tdepends = sed\n'
            printf '\tsource = stream-sprout-%s.tar.gz::%s\n' \
              "${REL_VER}" "${TARBALL_URL}"
            printf '\tsha256sums = %s\n' "${TARBALL_SHA256}"
            printf '\npkgname = stream-sprout\n'
          } > "${STAGING_DIR}/.SRCINFO"
          echo "rel_ver=${REL_VER}" >> "${GITHUB_OUTPUT}"
      - name: "Push PKGBUILD and .SRCINFO to AUR 🏔️"
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
          REL_VER: ${{ steps.pkgbuild.outputs.rel_ver }}
        run: |
          if [[ -z "${AUR_KEY}" ]]; then
            echo "ERROR! AUR_KEY secret is not set."
            exit 1
          fi
          AUR_KEY_FILE="${RUNNER_TEMP}/aur_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/known_hosts"
          trap 'rm -f "${AUR_KEY_FILE}"' EXIT
          install -m 600 /dev/null "${AUR_KEY_FILE}"
          printf '%s\n' "${AUR_KEY}" > "${AUR_KEY_FILE}"
          chmod 600 "${AUR_KEY_FILE}"
          ssh-keyscan -t ed25519 aur.archlinux.org > "${KNOWN_HOSTS_FILE}"
          if [[ ! -s "${KNOWN_HOSTS_FILE}" ]]; then
            echo "ERROR! Failed to scan SSH host key for aur.archlinux.org."
            exit 1
          fi
          GIT_SSH_COMMAND="ssh -i '${AUR_KEY_FILE}' -o IdentitiesOnly=yes"
          GIT_SSH_COMMAND+=" -o UserKnownHostsFile='${KNOWN_HOSTS_FILE}'"
          GIT_SSH_COMMAND+=" -o StrictHostKeyChecking=yes"
          export GIT_SSH_COMMAND
          AUR_DIR="${RUNNER_TEMP}/aur"
          rm -rf "${AUR_DIR}"
          git clone ssh://aur@aur.archlinux.org/stream-sprout.git "${AUR_DIR}"
          cd "${AUR_DIR}"
          git checkout -B master
          cp \
            "${RUNNER_TEMP}/aur-staging/PKGBUILD" \
            "${RUNNER_TEMP}/aur-staging/.SRCINFO" \
            .
          git config user.name "Martin Wimpress"
          git config user.email "code@wimpress.io"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No AUR package changes to publish."
          else
            git commit -m "Update to ${REL_VER}"
            git push origin master
          fi
