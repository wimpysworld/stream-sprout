name: Test build stream-sprout 🚧

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/*.yml
      - stream-sprout
      - nfpm.yaml
      - flake.nix
      - nix/package.nix
      - Containerfile
  push:
    branches:
      - main
    paths:
      - .github/workflows/*.yml
      - stream-sprout
      - nfpm.yaml
      - flake.nix
      - nix/package.nix
      - Containerfile
  workflow_dispatch:

permissions: {}

# TODO: arm64 runner
# https://github.blog/changelog/2024-06-03-actions-arm-based-linux-and-windows-runners-are-now-in-public-beta/

jobs:
  test-nfpm-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Checkout 🥡"
        uses: actions/checkout@v7
      - name: "Install nfpm 📦"
        run: |
          NFPM_VERSION="2.46.3"
          NFPM_SHA256="9170d25ea056d7329def38134b2bcad98d02d221f8331610dcd619e84d28c565"
          ARCHIVE="${RUNNER_TEMP}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location --retry 5 \
            --output "${ARCHIVE}" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  ${ARCHIVE}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${ARCHIVE}" -C "${RUNNER_TEMP}/bin" nfpm
          "${RUNNER_TEMP}/bin/nfpm" --version
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: "Build & Test Linux packages 📦"
        run: |
          REL_VER=$(grep '^readonly VERSION=' stream-sprout | cut -d'"' -f2)
          mkdir -p dist
          VERSION="${REL_VER}" nfpm package --config nfpm.yaml \
            --packager deb \
            --target "dist/stream-sprout_${REL_VER}_all.deb"
          VERSION="${REL_VER}" nfpm package --config nfpm.yaml \
            --packager rpm \
            --target "dist/stream-sprout-${REL_VER}-1.noarch.rpm"
          VERSION="${REL_VER}" nfpm package --config nfpm.yaml \
            --packager apk \
            --target "dist/stream-sprout_${REL_VER}_noarch.apk"
          VERSION="${REL_VER}" nfpm package --config nfpm.yaml \
            --packager archlinux \
            --target "dist/stream-sprout-${REL_VER}-1-any.pkg.tar.zst"
          ls -la dist
          sudo apt-get -y update
          sudo apt-get -y install "./dist/stream-sprout_${REL_VER}_all.deb"

  test-nix-build:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: "Checkout 🥡"
        uses: "actions/checkout@v7"
      - name: "Install Nix ❄️"
        uses: "DeterminateSystems/nix-installer-action@v23"
      - name: "Enable Magic Nix Cache 🪄"
        uses: "DeterminateSystems/magic-nix-cache-action@v15"
      - name: "Build & Test .nix ❄️"
        run: |
          nix build .#stream-sprout
          tree ./result

  test-container-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: "Checkout 🥡"
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Container Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get stream-sprout version 🔢
        id: get_version
        run: |
          STREAM_SPROUT_VER=$(
            grep '^readonly VERSION=' stream-sprout | cut -d'"' -f2
          )
          echo "STREAM_SPROUT_VER=${STREAM_SPROUT_VER}" >> "${GITHUB_ENV}"
      - name: "Build Container 🐋"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: false
          tags: |
            ghcr.io/${{ github.repository }}:latest-alpine
            ghcr.io/${{ github.repository }}:${{ env.STREAM_SPROUT_VER }}-alpine
            ghcr.io/${{ github.repository }}:${{ github.sha }}-alpine
          platforms: linux/amd64, linux/arm64
      - name: Logout from Container Registry
        run: docker logout ghcr.io
